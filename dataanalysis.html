<!DOCTYPE html>
<html lang = "en">
	<head>
		<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#0a0a0a">
		<title>FLOOD IT &mdash; DATA ANALYSIS</title>
		<link rel = "stylesheet" href="style.css">
	</head>
	<body>
		<main class="analysis">
			<header id = "status">
				<h1>Data Analysis</h1>
			</header>

			<section class="analysis-section" aria-labelledby="sessions-title">
				<h2 id="sessions-title">Session ID</h2>
				<div id="session-list" class="analysis-list">
					<p class="empty">Loading sessions&hellip;</p>
				</div>
			</section>

			<section class="analysis-section" aria-labelledby="data-title">
				<h2 id="data-title">Data</h2>
				<p id="data-status" class="empty">Select a session to view its steps.</p>
				<div id="data-list" class="analysis-list data-list"></div>
			</section>
		</main>

		<div id="step-modal" class="modal" hidden>
			<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
				<div class="modal-head">
					<h3 id="modal-title">Timestep</h3>
					<button id="modal-close" type="button" aria-label="Close">Close</button>
				</div>

				<div class="modal-flow">
					<div class="board-block">
						<p class="board-label">Board Configuration</p>
						<div id="modal-board" class="mini-board" aria-label="Board before the move"></div>
					</div>

					<p id="modal-action" class="modal-action"></p>

					<div class="board-block">
						<p class="board-label">Next Board Configuration</p>
						<div id="modal-next-board" class="mini-board" aria-label="Board after the move"></div>
					</div>
				</div>

				<div class="modal-foot">
					<button id="modal-prev" type="button">Previous time step</button>
					<button id="modal-next" type="button">Next time step</button>
				</div>
			</div>
		</div>

		<script src="dataanalysis.js" defer></script>
	</body>
</html>
